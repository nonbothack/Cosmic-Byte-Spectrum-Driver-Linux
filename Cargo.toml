[workspace]
resolver = "2"
members = [
    "crates/spectrum-protocol",
    "crates/spectrum-hid",
    "crates/spectrum-core",
    "crates/spectrum-cli",
    "crates/spectrum-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Cosmic Byte Spectrum Linux Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cosmic-byte-spectrum/spectrum-linux"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
