<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#161e31" />
    </linearGradient>
    <linearGradient id="rgb-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="25%" stop-color="#ff9900" />
      <stop offset="50%" stop-color="#00ffcc" />
      <stop offset="75%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#rgb-neon)" stroke-width="4" opacity="0.6" />

  <!-- Mouse outer glow & neon contour -->
  <path d="M 256,90 C 190,90 150,140 150,210 L 150,320 C 150,400 195,435 256,435 C 317,435 362,400 362,320 L 362,210 C 362,140 322,90 256,90 Z" 
        fill="#121826" stroke="url(#rgb-neon)" stroke-width="8" filter="url(#glow)" />

  <!-- Mouse body -->
  <path d="M 256,90 C 190,90 150,140 150,210 L 150,320 C 150,400 195,435 256,435 C 317,435 362,400 362,320 L 362,210 C 362,140 322,90 256,90 Z" 
        fill="#182235" stroke="#2a3b5c" stroke-width="3" />

  <!-- Button Split Line -->
  <line x1="256" y1="92" x2="256" y2="200" stroke="#0e1422" stroke-width="4" />

  <!-- Scroll Wheel -->
  <rect x="244" y="125" width="24" height="52" rx="12" fill="#0c101a" stroke="url(#rgb-neon)" stroke-width="3" />
  <line x1="248" y1="140" x2="264" y2="140" stroke="#38bdf8" stroke-width="2" />
  <line x1="248" y1="150" x2="264" y2="150" stroke="#38bdf8" stroke-width="2" />
  <line x1="248" y1="160" x2="264" y2="160" stroke="#38bdf8" stroke-width="2" />

  <!-- DPI Button -->
  <rect x="249" y="195" width="14" height="22" rx="5" fill="#222f47" stroke="#475569" stroke-width="1.5" />

  <!-- Spectrum / Cosmic Wave LED Accent -->
  <path d="M 205,300 C 230,340 282,340 307,300" fill="none" stroke="url(#rgb-neon)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="256" cy="360" r="16" fill="url(#rgb-neon)" filter="url(#glow)" />
</svg>
